<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aprovação de Ordem de Serviço — Terra Auto Elétrica</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --primary: #0f172a;
      --accent: #eab308;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --warn: #92400e;
      --warn-bg: #fef3c7;
      --err: #b91c1c;
      --err-bg: #fee2e2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: var(--ink);
      padding: 16px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid var(--line);
    }

    .header {
      background: var(--bg);
      color: #ffffff;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 4px solid var(--accent);
    }

    .header-title h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
    }

    .header-title p {
      margin: 4px 0 0;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .body {
      padding: 22px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .status-loading {
      background: #f8fafc;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .status-error {
      background: var(--err-bg);
      border: 1px solid #fca5a5;
      color: var(--err);
    }

    .status-approved {
      background: var(--ok-bg);
      border: 1px solid #86efac;
      color: var(--ok);
      font-weight: 600;
    }

    .status-pending {
      background: var(--warn-bg);
      border: 1px solid #fcd34d;
      color: var(--warn);
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .info-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .info-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--ink);
      word-break: break-word;
    }

    .section {
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .desc-box {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px;
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .total-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      color: #ffffff;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 18px;
    }

    .total-label {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .total-value {
      font-size: 1.3rem;
      font-weight: 700;
      color: #facc15;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      font-size: 0.95rem;
      background: #ffffff;
